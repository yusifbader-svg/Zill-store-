<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZILL | The Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&family=Syne:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f4f4; color: #111; margin: 0; }
        .brand-font { font-family: 'Syne', sans-serif; }
        .size-option { border: 1px solid #d4d4d4; border-radius: 999px; padding: 9px 17px; font-size: 12px; transition: .2s; }
        .size-option.selected { background: #111; color: white; border-color: #111; }
        .size-option:disabled { opacity: .35; cursor: not-allowed; }
        .fade-text {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 1s ease, transform 1s ease;
        }
        .fade-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        #offers-bar {
            width: 100%;
            height: 52px;
            overflow: hidden;
            position: relative;
            background: #eeeeee;
            color: #555555;
            display: none;
            white-space: nowrap;
            direction: ltr;
            border-top: 1px solid #dddddd;
            border-bottom: 1px solid #dddddd;
            z-index: 45;
        }
        #offers-track {
            display: flex;
            align-items: center;
            width: max-content;
            min-width: max-content;
            height: 100%;
            white-space: nowrap;
            direction: ltr;
            animation: zillOffersMarquee 14s linear infinite !important;
            animation-play-state: running !important;
            will-change: transform;
        }
        .offer-item {
            display: inline-flex;
            align-items: center;
            flex: 0 0 auto;
            padding: 0 42px;
            font-size: 19px;
            font-weight: 600;
            letter-spacing: .2px;
            color: #555555;
            white-space: nowrap;
            direction: rtl;
        }
        .offer-dot {
            display: inline-block;
            margin-left: 30px;
            font-size: 15px;
            color: #999999;
        }
        @keyframes zillOffersMarquee {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(-50%, 0, 0); }
        }
    </style>
</head>
<body class="bg-[#f4f4f4] text-neutral-900 min-h-screen flex flex-col justify-between">

    <!-- شاشة الإنترو -->
    <div id="intro-screen" class="fixed inset-0 z-50 bg-[#f4f4f4] text-[#111] flex flex-col justify-between p-8 md:p-12 transition-opacity duration-1000">
        <div class="flex justify-between items-center w-full">
            <div class="flex flex-col items-start">
                <span class="brand-font text-2xl font-bold tracking-tight text-black">ظل</span>
                <span class="brand-font text-[10px] tracking-[0.3em] text-neutral-500 uppercase -mt-1">Zill</span>
            </div>
            <button onclick="skipIntro()" class="text-xs tracking-wider text-neutral-600 hover:text-black px-4 py-2 rounded-full border border-neutral-300 hover:border-black transition">
                تخطي ✕
            </button>
        </div>

        <div class="my-auto max-w-2xl mx-auto text-center px-4">
            <div class="h-28 flex items-center justify-center">
                <div id="scene-content" class="fade-text"></div>
            </div>
        </div>
        <div></div>
    </div>

    <!-- شريط العروض - يتحكم فيه Google Sheets / OffersBar -->
    <div id="offers-bar" aria-label="العروض">
        <div id="offers-track"></div>
    </div>

    <!-- الهيدر الرئيسي -->
    <header class="w-full px-8 py-6 flex justify-between items-center border-b border-neutral-200 bg-[#f4f4f4]/80 backdrop-blur-md sticky top-0 z-40">
        <div class="flex flex-col items-start">
            <span class="brand-font text-xl font-bold tracking-tight text-black">ظل</span>
            <span class="brand-font text-[9px] tracking-[0.3em] text-neutral-500 uppercase -mt-1">zill</span>
        </div>
        
        <div class="flex items-center gap-4">
            <input type="text" id="search-input" oninput="filterProducts()" placeholder="ابحث عن قطعة..." class="bg-white border border-neutral-300 rounded-full px-4 py-1.5 text-xs focus:outline-none focus:border-black transition w-40 md:w-64">
            
            <button onclick="toggleCartModal()" class="relative text-xs tracking-wider text-neutral-800 hover:text-black px-5 py-2 rounded-full border border-neutral-300 hover:border-black transition flex items-center gap-2">
                <span>السلة</span>
                <span id="cart-count" class="bg-black text-white text-[10px] px-1.5 py-0.5 rounded-full">0</span>
            </button>

            <button onclick="replayIntro()" class="text-xs tracking-wider text-neutral-600 hover:text-black px-3 py-2 rounded-full border border-neutral-200 transition hidden md:block">
                🎬 Replay Intro
            </button>
        </div>
    </header>

    <!-- شريط الأقسام -->
    <nav class="max-w-6xl mx-auto px-6 mt-8 flex gap-3 overflow-x-auto pb-2" id="categories-container">
        <button onclick="filterCategory('الكل')" class="category-btn active px-5 py-2 rounded-full text-xs font-semibold bg-black text-white transition">الكل</button>
    </nav>

    <!-- المنتجات -->
    <main class="max-w-6xl mx-auto px-6 py-8 w-full flex-grow">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="products-grid"></div>
    </main>

    <!-- صفحة تفاصيل المنتج -->
    <div id="product-modal" class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4" onclick="if(event.target===this) closeProductDetails()">
        <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[92vh] overflow-y-auto shadow-2xl relative">
            <button onclick="closeProductDetails()" class="absolute top-4 left-4 z-10 bg-white/90 rounded-full w-9 h-9 text-lg">✕</button>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-5 md:p-8">
                <div>
                    <div id="detail-main-image" class="w-full aspect-[4/5] bg-neutral-100 rounded-xl overflow-hidden"></div>
                    <div id="detail-thumbnails" class="flex gap-2 mt-3 overflow-x-auto"></div>
                </div>
                <div class="flex flex-col justify-center py-2">
                    <span id="detail-category" class="text-[10px] uppercase tracking-widest text-neutral-400 brand-font"></span>
                    <h2 id="detail-name" class="brand-font text-2xl font-bold mt-2"></h2>
                    <p id="detail-price" class="font-bold text-lg mt-4"></p>
                    <div class="border-t border-neutral-100 my-5"></div>
                    <h3 class="text-sm font-semibold mb-2">تفاصيل القطعة</h3>
                    <p id="detail-description" class="text-sm text-neutral-600 leading-8 whitespace-pre-line"></p>
                    <div class="mt-6">
                        <label class="block text-xs text-neutral-500 mb-2">اختار المقاس</label>
                        <div id="detail-sizes" class="flex flex-wrap gap-2"></div>
                        <p id="detail-size-hint" class="text-[11px] text-red-500 mt-2"></p>
                    </div>
                    <button id="detail-add-button" onclick="addSelectedProductToCart()" class="w-full bg-black text-white py-3 rounded-xl text-xs font-semibold mt-6 hover:bg-neutral-800 transition">أضف للسلة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة تنبيه الإضافة للسلة -->
    <div id="toast-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl space-y-4">
            <h3 class="brand-font text-base font-bold">تمت إضافة المنتج للسلة</h3>
            <p class="text-xs text-neutral-500">اذهب للسلة لتاكيد الاوردر أو تابع التسوق.</p>
            <div class="flex gap-2 pt-2">
                <button onclick="closeToastAndGoCart()" class="flex-1 bg-black text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-neutral-800 transition">اذهب للسلة</button>
                <button onclick="closeToast()" class="flex-1 bg-neutral-100 text-neutral-800 py-2.5 rounded-xl text-xs font-semibold hover:bg-neutral-200 transition">اختيار منتج آخر</button>
            </div>
        </div>
    </div>

    <!-- نافذة سلة الطلبات وتأكيد الشراء -->
    <div id="cart-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h3 class="brand-font text-lg font-bold">سلة الطلبات وتأكيد الشراء</h3>
                <button onclick="toggleCartModal()" class="text-neutral-500 hover:text-black text-sm">✕ إغلاق</button>
            </div>
            
            <div id="cart-items-container" class="overflow-y-auto max-h-36 divide-y divide-neutral-100 space-y-3 mb-4"></div>

            <div class="space-y-3 border-t pt-4">
                <div>
                    <label class="block text-xs text-neutral-500 mb-1">الاسم الكامل</label>
                    <input type="text" id="customer-name" class="w-full bg-neutral-50 border border-neutral-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-black" placeholder="اكتب اسمك هنا...">
                </div>
                <div>
                    <label class="block text-xs text-neutral-500 mb-1">رقم الهاتف</label>
                    <input type="text" id="customer-phone" class="w-full bg-neutral-50 border border-neutral-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-black" placeholder="01xxxxxxxxx">
                </div>
                <div>
                    <label class="block text-xs text-neutral-500 mb-1">المحافظة (تحديد سعر الشحن تلقائياً)</label>
                    <select id="customer-governorate" onchange="updateCartUI()" class="w-full bg-neutral-50 border border-neutral-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-black">
                        <option value="0">اختر المحافظة...</option>
                        <option value="50">القاهرة والجيزة (50 EGP)</option>
                        <option value="60">الإسكندرية (60 EGP)</option>
                        <option value="70">باقي المحافظات (70 EGP)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-neutral-500 mb-1">العنوان بالتفصيل</label>
                    <textarea id="customer-address" class="w-full bg-neutral-50 border border-neutral-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-black" placeholder="المدينة، الشارع..."></textarea>
                </div>
            </div>

            <div class="border-t pt-4 mt-4 space-y-1">
                <div class="flex justify-between text-xs text-neutral-500">
                    <span>قيمة المنتجات:</span>
                    <span id="products-subtotal">0 EGP</span>
                </div>
                <div class="flex justify-between text-xs text-neutral-500">
                    <span>سعر الشحن:</span>
                    <span id="shipping-cost">0 EGP</span>
                </div>
                <div class="flex justify-between font-bold text-sm pt-2 border-t">
                    <span>الإجمالي الكلي:</span>
                    <span id="cart-total">0 EGP</span>
                </div>
                <button onclick="confirmOrder()" class="w-full bg-black text-white py-3 mt-3 rounded-xl text-xs font-semibold tracking-wider hover:bg-neutral-800 transition">
                    تأكيد الاوردر ✅
                </button>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="w-full py-6 text-center border-t border-neutral-200 text-neutral-400 text-xs brand-font tracking-widest">
        <div>ZILL © 2026 • ALL RIGHTS RESERVED</div>
        <div class="mt-3 text-neutral-600 tracking-normal font-sans">
            <span class="font-semibold">الدعم الفني:</span>
            <a href="tel:01042898254" class="mx-1 hover:text-black" dir="ltr">01042898254</a>
            <span class="mx-1">•</span>
            <a href="https://instagram.com/zillstor.e" target="_blank" rel="noopener noreferrer" class="mx-1 hover:text-black" dir="ltr">@zillstor.e</a>
        </div>
    </footer>

    <script>
        // --- الإنترو ---
        const scenes = [
            { type: "text", content: "«كما لا يفارقك ظلك...»" },
            { type: "text", content: "«ما دام للنور حضور.»" },
            { type: "text", content: "«نحن في ZILL نؤمن أن الحكاية لا تنتهي عند الاختيار...»" },
            { type: "text", content: "«بل تبدأ من أول خطوة.»" },
            { type: "text", content: "«ونظل معك... حتى تصل إليك اختياراتك.»" },
            { type: "final", title: "ZILL", subtitle: "More than a choice. A presence." }
        ];

        let currentScene = 0;
        let introTimer;

        function playScene() {
            const container = document.getElementById('scene-content');
            container.classList.remove('active');
            setTimeout(() => {
                if (currentScene < scenes.length) {
                    const scene = scenes[currentScene];
                    if (scene.type === "text") {
                        container.innerHTML = `<p class="text-xl md:text-3xl font-light text-neutral-800 leading-relaxed">${scene.content}</p>`;
                    } else if (scene.type === "final") {
                        container.innerHTML = `
                            <div>
                                <h1 class="brand-font text-5xl md:text-7xl font-light tracking-tight text-black mb-3">${scene.title}</h1>
                                <p class="brand-font text-xs md:text-sm tracking-[0.3em] text-neutral-500 uppercase">${scene.subtitle}</p>
                            </div>
                        `;
                    }
                    container.classList.add('active');
                    let duration = (currentScene === scenes.length - 1) ? 3000 : 2200;
                    currentScene++;
                    introTimer = setTimeout(playScene, duration);
                } else {
                    skipIntro();
                }
            }, 350);
        }

        function startIntroSequence() { currentScene = 0; playScene(); }
        function skipIntro() {
            clearTimeout(introTimer);
            const screen = document.getElementById('intro-screen');
            screen.style.opacity = '0';
            setTimeout(() => { screen.style.display = 'none'; }, 1000);
        }
        function replayIntro() {
            const screen = document.getElementById('intro-screen');
            screen.style.display = 'flex';
            setTimeout(() => { screen.style.opacity = '1'; }, 50);
            startIntroSequence();
        }

        // --- السلة والطلب ---
        let cart = [];
        let shippingOptions = [];

        function addToCart(id, name, price, size) {
            if (!size) { alert('من فضلك اختار المقاس الأول.'); return; }
            let existingItem = cart.find(item => String(item.id) === String(id) && item.size === size);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price: parseFloat(price) || 0, size, quantity: 1 });
            }
            updateCartUI();
            closeProductDetails();
            document.getElementById('toast-modal').classList.remove('hidden');
        }

        function closeToast() { document.getElementById('toast-modal').classList.add('hidden'); }
        function closeToastAndGoCart() { closeToast(); toggleCartModal(); }

        function getShippingFee() {
            const select = document.getElementById('customer-governorate');
            return select ? (parseFloat(select.value) || 0) : 0;
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.quantity, 0);
            const container = document.getElementById('cart-items-container');

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-neutral-400 py-6 text-xs">سلة الطلبات فارغة حالياً.</p>`;
                document.getElementById('products-subtotal').innerText = '0 EGP';
                document.getElementById('shipping-cost').innerText = '0 EGP';
                document.getElementById('cart-total').innerText = '0 EGP';
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            container.innerHTML = cart.map(item => `
                <div class="py-2 flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold">${escapeHTML(item.name)}</p>
                        <p class="text-neutral-500">المقاس: ${escapeHTML(item.size)} · ${item.price} EGP × ${item.quantity}</p>
                    </div>
                    <button onclick="removeFromCart('${String(item.id).replace(/'/g, "\\'")}','${String(item.size).replace(/'/g, "\\'")}')" class="text-red-500 hover:underline px-2 py-1">حذف</button>
                </div>
            `).join('');

            const shippingFee = getShippingFee();
            document.getElementById('products-subtotal').innerText = subtotal + ' EGP';
            document.getElementById('shipping-cost').innerText = shippingFee + ' EGP';
            document.getElementById('cart-total').innerText = (subtotal + shippingFee) + ' EGP';
        }

        function jsLiteral(value) {
            return JSON.stringify(String(value ?? '')).replace(/'/g, '\\u0027');
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        function removeFromCart(id, size) {
            cart = cart.filter(item => !(String(item.id) === String(id) && item.size === size));
            updateCartUI();
        }

        function toggleCartModal() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        async function confirmOrder() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            const name = document.getElementById('customer-name').value.trim();
            const phone = document.getElementById('customer-phone').value.trim();
            const govSelect = document.getElementById('customer-governorate');
            const gov = govSelect.value;
            const governorateName = govSelect.options[govSelect.selectedIndex]?.dataset.governorate
                || govSelect.options[govSelect.selectedIndex]?.textContent.trim() || '';
            const address = document.getElementById('customer-address').value.trim();

            if (!name || !phone || gov === '0' || !address) {
                alert('يرجى ملء كافة بيانات الشحن واختيار المحافظة.');
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const shipping = getShippingFee();
            const total = subtotal + shipping;
            const orderItems = cart.map(item => ({
                id: item.id,
                name: item.name,
                price: item.price,
                size: item.size,
                quantity: item.quantity
            }));

            const confirmButton = document.querySelector('#cart-modal button[onclick="confirmOrder()"]');
            if (confirmButton) {
                confirmButton.disabled = true;
                confirmButton.textContent = 'جاري إرسال الطلب...';
            }

            try {
                // صيغة البيانات مطابقة تماماً لما يستقبله doPost في Google Apps Script.
                // وضع no-cors يسمح بإرسال الطلب، لكن المتصفح لا يتيح قراءة رد Google Apps Script.
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        customer_name: name,
                        phone: phone,
                        governorate: governorateName,
                        address: address,
                        items: JSON.stringify({ products: orderItems, subtotal: subtotal, shipping: shipping }),
                        total: total
                    })
                });

                alert(`تم إرسال طلبك يا ${name}. سنتواصل معك قريباً لتأكيد الطلب.`);
                cart = [];
                updateCartUI();
                document.getElementById('cart-modal').classList.add('hidden');
                document.getElementById('customer-name').value = '';
                document.getElementById('customer-phone').value = '';
                document.getElementById('customer-governorate').value = '0';
                document.getElementById('customer-address').value = '';
            } catch (error) {
                console.error('Order submission error:', error);
                alert('حصلت مشكلة في إرسال الطلب. راجع اتصال الإنترنت وحاول مرة أخرى.');
            } finally {
                if (confirmButton) {
                    confirmButton.disabled = false;
                    confirmButton.textContent = 'تأكيد الاوردر ✅';
                }
            }
        }

        // --- ربط Google Sheets ---
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzDxwMRuOJk8QnRQfOekAJ0H313yC59pyUlb3FV9oZjQAR775_aoHAaRl34PkNsv1Tk/exec';
        let allProducts = [];
        let activeCategory = 'الكل';
        let activeOffers = [];
        window.slideIndices = {};

        function renderOffersBar(offers) {
            const bar = document.getElementById('offers-bar');
            const track = document.getElementById('offers-track');
            if (!bar || !track) return;

            const validOffers = (Array.isArray(offers) ? offers : [])
                .filter(item => item && item.active === true && String(item.text || '').trim())
                .sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));

            activeOffers = validOffers;

            if (!validOffers.length) {
                track.innerHTML = '';
                bar.style.display = 'none';
                return;
            }

            const items = validOffers.map(item =>
                `<span class="offer-item"><span>${escapeHTML(String(item.text))}</span><span class="offer-dot">✦</span></span>`
            ).join('');

            track.innerHTML = items + items;
            bar.style.display = 'block';
            track.style.animationDuration = (validOffers.length === 1 ? 16 : Math.min(28, 12 + validOffers.length * 4)) + 's';
        }

        function normalizeProduct(product) {
            const imageValue = product.image_url || '';
            const images = Array.isArray(imageValue)
                ? imageValue
                : String(imageValue).split(/[,;\n]/).map(url => url.trim()).filter(Boolean);

            return {
                id: product.id,
                name: product.name || 'منتج بدون اسم',
                price: Number(product.price) || 0,
                old_price: Number(product.old_price) || 0,
                sizes: product.sizes || '',
                stock_alert: product.stock_alert || '',
                category: product.category || 'Hoodies',
                images: images.join(','),
                description: product.description || ''
            };
        }

        function populateShipping(shippingRows) {
            const select = document.getElementById('customer-governorate');
            if (!Array.isArray(shippingRows) || shippingRows.length === 0) return;

            shippingOptions = shippingRows;
            select.innerHTML = '<option value="0">اختر المحافظة...</option>' + shippingRows.map(row => {
                const governorate = String(row.governorate || '').trim();
                const cost = Number(row.cost) || 0;
                return `<option value="${cost}" data-governorate="${escapeHTML(governorate)}">${escapeHTML(governorate)} (${cost} EGP)</option>`;
            }).join('');
            updateCartUI();
        }

        async function fetchProducts() {
            const grid = document.getElementById('products-grid');
            try {
                const response = await fetch(WEB_APP_URL);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();

                // doGet يرجع كائناً يحتوي على products و shipping، وليس مصفوفة منتجات مباشرة.
                allProducts = (Array.isArray(data.products) ? data.products : []).map(normalizeProduct);
                populateShipping(data.shipping);
                setupCategories(allProducts);
                renderOffersBar(data.offers);
                displayProducts(allProducts);
            } catch (error) {
                console.error('خطأ في جلب بيانات Google Sheets:', error);
                allProducts = [];
                setupCategories(allProducts);
                grid.innerHTML = `<p class="col-span-3 text-center text-neutral-400 py-12">تعذر تحميل المنتجات من المتجر. حاول تحديث الصفحة بعد قليل.</p>`;
            }
        }

        function setupCategories(products) {
            const container = document.getElementById('categories-container');
            const categories = ['الكل', ...new Set(products.map(p => p.category).filter(Boolean))];
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${String(cat).replace(/'/g, "\\'")}')" class="category-btn px-5 py-2 rounded-full text-xs font-semibold ${cat === 'الكل' ? 'bg-black text-white' : 'bg-white text-neutral-800 border border-neutral-300'} transition">
                    ${escapeHTML(cat)}
                </button>
            `).join('');
        }

        function filterCategory(category) {
            activeCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.innerText === category) {
                    btn.className = 'category-btn px-5 py-2 rounded-full text-xs font-semibold bg-black text-white transition';
                } else {
                    btn.className = 'category-btn px-5 py-2 rounded-full text-xs font-semibold bg-white text-neutral-800 border border-neutral-300 transition';
                }
            });
            filterProducts();
        }

        function filterProducts() {
            const searchText = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = allProducts.filter(product => {
                const matchesCat = activeCategory === 'الكل' || product.category === activeCategory;
                const matchesSearch = String(product.name).toLowerCase().includes(searchText)
                    || String(product.description || '').toLowerCase().includes(searchText);
                return matchesCat && matchesSearch;
            });
            displayProducts(filtered);
        }

        function displayProducts(productsToDisplay) {
            const grid = document.getElementById('products-grid');
            if (productsToDisplay.length === 0) {
                grid.innerHTML = `<p class="col-span-3 text-center text-neutral-400 py-12">لا توجد منتجات مطابقة للبحث.</p>`;
                return;
            }

            grid.innerHTML = productsToDisplay.map(product => {
                const imageList = product.images ? product.images.split(',').map(url => url.trim()).filter(Boolean) : [];
                if (!window.slideIndices[product.id]) window.slideIndices[product.id] = 0;
                const currentIndex = window.slideIndices[product.id];
                const imageHTML = imageList.length
                    ? `<img id="img-${escapeHTML(product.id)}" src="${escapeHTML(imageList[currentIndex] || imageList[0])}" class="w-full h-full object-cover transition duration-500" alt="${escapeHTML(product.name)}">`
                    : `<div class="w-full h-full flex items-center justify-center text-neutral-400 text-xs">الصورة غير متاحة</div>`;

                return `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200/60 flex flex-col justify-between">
                        <div class="relative w-full h-72 bg-neutral-100 rounded-xl overflow-hidden mb-4 group">
                            ${imageHTML}
                            ${imageList.length > 1 ? `
                                <button onclick='changeSlide(${jsLiteral(product.id)}, -1)' class="absolute left-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white px-2 py-1 rounded-full text-xs shadow transition">❮</button>
                                <button onclick='changeSlide(${jsLiteral(product.id)}, 1)' class="absolute right-2 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white px-2 py-1 rounded-full text-xs shadow transition">❯</button>
                            ` : ''}
                        </div>
                        <div>
                            <span class="text-[10px] uppercase tracking-widest text-neutral-400 brand-font">${escapeHTML(product.category)}</span>
                            <h3 class="brand-font text-base font-semibold mt-1">${escapeHTML(product.name)}</h3>
                            <p class="text-xs text-neutral-500 mt-1 font-light">${escapeHTML(product.description)}</p>
                        </div>
                        <div class="flex justify-between items-center mt-6 pt-4 border-t border-neutral-100">
                            <span class="font-bold text-sm">${product.price} EGP</span>
                            <button onclick='openProductDetails(${jsLiteral(product.id)})' class="bg-black text-white px-4 py-2 rounded-full text-xs font-semibold hover:bg-neutral-800 transition">عرض التفاصيل</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        let selectedDetailProduct = null;
        let selectedDetailSize = '';
        let selectedDetailImage = 0;

        function getProductImages(product) {
            if (!product || !product.images) return [];
            return String(product.images).split(/[,;\n]/).map(url => url.trim()).filter(Boolean);
        }

        function getProductSizes(product) {
            return String(product?.sizes || '').split(/[,;|\n/]+/).map(size => size.trim()).filter(Boolean);
        }

        function openProductDetails(productId) {
            const product = allProducts.find(item => String(item.id) === String(productId));
            if (!product) return;
            selectedDetailProduct = product;
            selectedDetailSize = '';
            selectedDetailImage = 0;
            document.getElementById('detail-category').textContent = product.category || '';
            document.getElementById('detail-name').textContent = product.name;
            document.getElementById('detail-price').textContent = `${product.price} EGP`;
            document.getElementById('detail-description').textContent = product.description || 'لا توجد تفاصيل إضافية لهذا المنتج حالياً.';
            renderDetailImages();
            renderDetailSizes();
            const modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeProductDetails() {
            const modal = document.getElementById('product-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        function renderDetailImages() {
            const images = getProductImages(selectedDetailProduct);
            const main = document.getElementById('detail-main-image');
            const thumbs = document.getElementById('detail-thumbnails');
            if (!images.length) {
                main.innerHTML = '<div class="w-full h-full flex items-center justify-center text-neutral-400 text-xs">الصورة غير متاحة</div>';
                thumbs.innerHTML = '';
                return;
            }
            main.innerHTML = `<img src="${escapeHTML(images[selectedDetailImage] || images[0])}" class="w-full h-full object-cover" alt="${escapeHTML(selectedDetailProduct.name)}">`;
            thumbs.innerHTML = images.map((url, index) => `<button onclick="selectDetailImage(${index})" class="w-16 h-20 flex-shrink-0 rounded-lg overflow-hidden border-2 ${index === selectedDetailImage ? 'border-black' : 'border-transparent'}"><img src="${escapeHTML(url)}" class="w-full h-full object-cover"></button>`).join('');
        }

        function selectDetailImage(index) {
            const images = getProductImages(selectedDetailProduct);
            if (index < 0 || index >= images.length) return;
            selectedDetailImage = index;
            renderDetailImages();
        }

        function renderDetailSizes() {
            const sizes = getProductSizes(selectedDetailProduct);
            const container = document.getElementById('detail-sizes');
            const hint = document.getElementById('detail-size-hint');
            const button = document.getElementById('detail-add-button');
            if (!sizes.length) {
                container.innerHTML = '';
                hint.textContent = 'المقاسات غير مضافة لهذا المنتج. أضفها في عمود المقاسات داخل Google Sheets.';
                button.disabled = true;
                button.classList.add('opacity-40', 'cursor-not-allowed');
                return;
            }
            hint.textContent = 'لازم تختار مقاس قبل الإضافة للسلة.';
            button.disabled = true;
            button.classList.add('opacity-40', 'cursor-not-allowed');
            container.innerHTML = sizes.map(size => `<button type="button" class="size-option" onclick='selectDetailSize(${jsLiteral(size)})'>${escapeHTML(size)}</button>`).join('');
        }

        function selectDetailSize(size) {
            selectedDetailSize = size;
            document.querySelectorAll('#detail-sizes .size-option').forEach(button => {
                const selected = button.textContent === size;
                button.classList.toggle('selected', selected);
            });
            document.getElementById('detail-size-hint').textContent = `المقاس المختار: ${size}`;
            const button = document.getElementById('detail-add-button');
            button.disabled = false;
            button.classList.remove('opacity-40', 'cursor-not-allowed');
        }

        function addSelectedProductToCart() {
            if (!selectedDetailProduct || !selectedDetailSize) return;
            addToCart(selectedDetailProduct.id, selectedDetailProduct.name, selectedDetailProduct.price, selectedDetailSize);
        }

        function changeSlide(productId, direction) {
            const product = allProducts.find(item => String(item.id) === String(productId));
            if (!product || !product.images) return;
            const images = product.images.split(',').map(url => url.trim()).filter(Boolean);
            if (images.length < 2) return;
            if (window.slideIndices[productId] === undefined) window.slideIndices[productId] = 0;
            window.slideIndices[productId] += direction;
            if (window.slideIndices[productId] >= images.length) window.slideIndices[productId] = 0;
            if (window.slideIndices[productId] < 0) window.slideIndices[productId] = images.length - 1;
            const image = document.getElementById(`img-${CSS.escape(String(productId))}`);
            if (image) image.src = images[window.slideIndices[productId]];
        }

        window.onload = () => {
            const introSeenKey = 'zill_intro_seen_v1';

            if (sessionStorage.getItem(introSeenKey) === '1') {
                const screen = document.getElementById('intro-screen');
                if (screen) {
                    screen.style.display = 'none';
                    screen.style.opacity = '0';
                }
            } else {
                startIntroSequence();
                sessionStorage.setItem(introSeenKey, '1');
            }

            fetchProducts();
        };
    </script>
</body>
</html>
